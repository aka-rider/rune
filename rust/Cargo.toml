[workspace]
resolver = "2"
# Explicit, NOT `crates/*`: a glob makes any stray directory under `crates/`
# (an agent-harness scratch dir, an editor temp folder) a workspace member,
# and cargo then fails the whole workspace with "failed to load manifest for
# workspace member". Spelling the members out makes that impossible.
members = [
    "crates/rune-cli",
    "crates/rune-core",
    "crates/rune-db",
    "crates/rune-fuzz",
    "crates/rune-md",
    "crates/rune-tui",
    "crates/rune-vfs",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
ratatui = "0.30.2"
ratatui-termina = "0.1.0"
termina = "0.3.3"
comrak = "0.54"
unicode-width = "0.2.2"
unicode-segmentation = "1.13"
libc = "0.2"
base64 = "0.22"
proptest = "1"
criterion = "0.5"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
