[package]
name = "rune-tui"
version = "0.1.0"
edition.workspace = true

[dependencies]
rune-core = { path = "../rune-core" }
rune-db = { path = "../rune-db" }
rune-md = { path = "../rune-md" }
rune-syntax = { path = "../rune-syntax" }
rune-vfs = { path = "../rune-vfs" }
ratatui = { workspace = true, features = ["termina"] }
ratatui-termina = { workspace = true }
termina = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
rune-core = { path = "../rune-core" }
# Self-dependency trick (Cargo permits it for dev-dependencies): pulls in
# THIS crate again with `testgrid` turned on, so feature unification
# enables `crate::testgrid` for every integration test in `tests/` without
# needing `--features testgrid` on the command line — `cargo test
# --workspace` (the Makefile's `test` target) sees it automatically.
rune-tui = { path = ".", features = ["testgrid"] }

[features]
# Exposes `testgrid` (plan WP1.S1) to integration tests, which link the
# library WITHOUT `cfg(test)` — see the dev-dependency self-reference above.
testgrid = []

[lints]
workspace = true
