name: Nightly

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run even when main is unchanged since the last passing nightly
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            changed=true
          else
            changed="$(scripts/ci/nightly.sh changed)"
          fi
          case "$changed" in
          true | false) echo "changed=$changed" >> "$GITHUB_OUTPUT" ;;
          *)
            echo "nightly gate printed '$changed', expected true or false" >&2
            exit 1
            ;;
          esac

  full:
    needs: changed
    if: needs.changed.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-arm64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - run: make ci-setup
      - run: make ci-nightly

  mark:
    needs: full
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/ci/nightly.sh mark
