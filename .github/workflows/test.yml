name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain input: rust-toolchain.toml at the repo root pins it.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: make fmt

      - name: Lint
        run: make lint

      - name: Test
        run: cargo test --workspace

      - name: Strict invariants
        run: cargo test -p rune-md --features strict-invariants
