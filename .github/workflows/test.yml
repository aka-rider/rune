name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No toolchain input: rust-toolchain.toml at the repo root pins it.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: make fmt

      - name: Lint
        run: make lint

      - uses: taiki-e/install-action@nextest

      - name: Test
        run: make test PROFILE=ci
