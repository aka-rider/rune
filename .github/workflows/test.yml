name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain input: rust-toolchain.toml at the repo root pins it.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: make fmt

      - name: Lint
        run: make lint

      - name: Test
        run: cargo test --workspace

      # Deliberately NON-BLOCKING: the strict-invariants feature turns upstream
      # comrak sourcepos self-inconsistencies into panics. They are filed
      # against comrak, not ours to fix, and must not gate a branch. Kept in CI
      # so a regression on OUR side is still visible in the log.
      - name: Strict invariants (non-blocking)
        continue-on-error: true
        run: cargo test -p rune-md --features strict-invariants
