name: Cut Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.3.0, no leading v)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  cut-release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-release
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version, commit, push
        run: cargo release "$VERSION" --package rune-cli --execute --no-confirm
      - name: Dispatch the dist release pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main --field tag="v$VERSION"
