# Keep .devbox (self-gitignored nix store, ~1.5 GB) and fuzz artifacts out of
# the per-job tree copies; target/ is always excluded regardless of this flag.
gitignore = true
# The workspace denies dead_code; without capped lints every code-deleting
# mutant fails the build as "unviable", each one costing a full compile.
cap_lints = true
# cap_lints also disables rustc's long-running-const-eval guard, so builds
# need their own bound. Parallel-job contention pushed legitimate builds
# past 4x, so this is set generously above the observed worst case.
build_timeout_multiplier = 8.0
# Proptest suites make test time vary; floor the auto timeout above the
# default 20 s.
minimum_test_timeout = 60
# Grows only during triage; every entry must be justified in the commit
# that adds it.
exclude_re = [
  'anim\.rs.*replace < with <= in clamp_delay',
  'cellsize\.rs.*replace > with >= in fit_cells',
  'percent\.rs.*replace \| with \^ in decode',
  'anchor\.rs.*NormalizedChars.*next',
  'wrap/mod\.rs:147:.*replace > with >= in WrapMap::wrap_line',
  'wrap/mod\.rs:158:.*delete ! in WrapMap::wrap_line',
  'wrap/mod\.rs:162:.*replace > with >= in WrapMap::wrap_line',
  'wrap/mod\.rs:170:.*replace \+ with \* in WrapMap::wrap_line',
  'query\.rs:201:.*replace \+ with \* in WrapSnapshot::syntax_to_wrap',
  'query\.rs.*replace < with <= in cells_up_to',
  'query\.rs.*replace \+= with \*= in cells_up_to',
  'query\.rs.*replace < with <= in snap_to_grapheme_boundary',
  'query\.rs.*replace \+ with \* in snap_to_grapheme_boundary',
  'query\.rs:127:.*replace < with <= in byte_col_from_visual',
  'query\.rs.*replace \+= with \*= in WrapSnapshot::syntax_to_wrap',
  'width\.rs.*replace next_grapheme -> Option<&.a str> with Some\(""\)',
  'replace - with \+ in Buffer::build_edited_content',
  'lineindex\.rs.*replace && with \|\| in Buffer::line',
  'lineindex\.rs.*replace - with \+ in Buffer::line_col_to_offset',
  'lineindex\.rs.*replace - with / in Buffer::line_col_to_offset',
  'lineindex\.rs.*replace > with >= in Buffer::line_col_to_offset',
  'trailing\.rs.*replace > with >= in line_content_end',
  'trailing\.rs.*replace > with >= in whitespace_run_start',
  'cursor\.rs.*replace < with <= in Cursor::selection_range',
  'replace CursorSet::is_empty -> bool with false',
  'replace > with >= in CursorSet::merge',
  'undo\.rs.*replace \|\| with && in reapply',
  'detect\.rs.*replace contains_ignore_ascii_case -> bool with true',
  'detect\.rs.*replace looks_like_modeline -> bool with true',
  'highlight\.rs.*replace \+= with \*= in run_query',
  'main\.rs.*match guard doc_db\.publish_mode\.is_create_only',
  'db_bootstrap\.rs.*replace == with != in blocking_call',
  'emit/mod\.rs:230:.*replace > with >= in fill_gaps',
  'emit/mod\.rs:233:.*replace > with >= in fill_gaps',
  'emit/mod\.rs:237:.*replace < with <= in fill_gaps',
  'emit/table\.rs:112:.*replace > with >= in emit_table',
  'wrapped\.rs:99:.*replace > with >= in place_first_word',
  'parse/table\.rs:98:.*replace && with \|\| in build_table',
  'shadow\.rs:34:.*replace == with != in parse_shadow',
  'shadow\.rs:181:.*replace \+ with \* in walk_region',
  'frontmatter\.rs:58:',
  'frontmatter\.rs:66:.*with false',
  'replace \+= with \*= in leading_backtick_run',
  'replace \+= with \*= in trailing_backtick_run',
  'layout\.rs:420:.*replace > with >= in constrain_widths',
  'inline\.rs:247:.*replace < with <= in trailing_backtick_run',
  'inline\.rs:248:.*replace != with == in trailing_backtick_run',
  'inline\.rs:253:.*replace < with == in trailing_backtick_run',
  'inline\.rs:253:.*replace < with > in trailing_backtick_run',
  'inline\.rs:253:.*replace == with != in trailing_backtick_run',
  'align\.rs:119:36:.*replace > with >= in emphasized_ranges',
  'hunks\.rs:135:21:.*replace < with <= in chunk_walk',
  'hunks\.rs:135:55:.*replace < with <= in chunk_walk',
  'hunks\.rs:145:23:.*replace \+= with \*= in chunk_walk',
  'hunks\.rs:149:25:.*replace \+= with \*= in chunk_walk',
  'hunks\.rs:166:49:.*replace <= with > in chunk_walk',
  'hunks\.rs:168:35:.*replace \+= with -= in chunk_walk',
  'hunks\.rs:168:35:.*replace \+= with \*= in chunk_walk',
  'hunks\.rs:171:37:.*replace \+= with -= in chunk_walk',
  'hunks\.rs:171:37:.*replace \+= with \*= in chunk_walk',
  'hunks\.rs:186:23:.*replace > with >= in chunk_walk',
  'hunks\.rs:206:16:.*replace < with <= in chunk_walk',
  'hunks\.rs:217:38:.*replace < with <= in overlaps',
  'hunks\.rs:218:37:.*replace < with <= in overlaps',
  'hunks\.rs:219:64:.*replace < with == in overlaps',
  'hunks\.rs:219:64:.*replace < with > in overlaps',
  'hunks\.rs:219:64:.*replace < with <= in overlaps',
  # rune-vfs, on Linux: these five mutate a macOS-only (`#[cfg(target_os =
  # "macos")]`) function body. On this build target the function is not
  # compiled in at all, so applying the mutation produces a byte-identical
  # binary to baseline — no test, on any backend, can ever observe a
  # difference. The platform-live counterpart of each (Disk::flagged_rename's
  # Linux `renameat2` body, Mem-independent Disk::trash's Linux body,
  # excl_flag's Linux body) is exercised by real tests and is not excluded.
  'disk\.rs:41:9:.*replace Disk::flagged_rename',
  'disk\.rs:46:16:.*replace == with != in Disk::flagged_rename',
  'disk\.rs:224:9:.*Disk>::trash',
  'disk\.rs:327:5:.*replace swap_flag',
  'disk\.rs:332:5:.*replace excl_flag',
  # rune-vfs: `Mem::symlink`'s own `inode`/`mod_tick` fields are write-only.
  # `Vfs::stat` (the only reader of either field) always resolves a symlink
  # path through `follow_links` before looking anything up, for every key
  # that carries a `link_target` — so a symlink entry's own identity fields
  # are never the ones a stat call returns, under any path that reaches
  # them (direct stat, a chain hop, even swapping the entry onto another key
  # via `exchange`, since the swapped-in entry is still flagged as a link and
  # still gets resolved away). No public `Vfs` method can observe them.
  'fault\.rs:311:20:.*replace \+= with \*= in Mem::symlink',
  'fault\.rs:314:26:.*replace \+= with \*= in Mem::symlink',
]
exclude_globs = []
