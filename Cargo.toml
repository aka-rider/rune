[workspace]
resolver = "2"
# Explicit, NOT `crates/*`: a glob makes any stray directory under `crates/`
# (an agent-harness scratch dir, an editor temp folder) a workspace member,
# and cargo then fails the whole workspace with "failed to load manifest for
# workspace member". Spelling the members out makes that impossible.
members = [
    "crates/rune-cli",
    "crates/rune-core",
    "crates/rune-db",
    "crates/rune-fuzz",
    "crates/rune-image",
    "crates/rune-md",
    "crates/rune-merge",
    "crates/rune-nav",
    "crates/rune-syntax",
    "crates/rune-ts",
    "crates/rune-tui",
    "crates/rune-vfs",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
rune-image = { path = "crates/rune-image" }
compact_str = "0.9.1"
ratatui = "0.30.2"
ratatui-termina = "0.1.0"
termina = "0.3.3"
comrak = "0.54"
unicode-width = "0.2.2"
unicode-segmentation = "1.13"
libc = "0.2"
base64 = "0.22"
proptest = "1"
criterion = "0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
trash = "5.2"
nucleo-matcher = "0.3.1"
ignore = "0.4"
similar = { version = "3.1", features = ["text", "inline", "unicode"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
map_unwrap_or = "deny"

[workspace.lints.rust]
dead_code = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# cargo-release only bumps and pushes the release commit; the tag is created
# by the GitHub Release that dist's dispatch-triggered workflow publishes
[workspace.metadata.release]
tag = false
publish = false
allow-branch = ["main"]
