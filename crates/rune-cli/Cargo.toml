[package]
name = "rune-cli"
version = "1.2.0"
edition.workspace = true
description = "TUI markdown editor that protects your words"
homepage = "https://github.com/aka-rider/rune"
repository = "https://github.com/aka-rider/rune"
license = "MIT"

[[bin]]
name = "rune"
path = "src/main.rs"

[dependencies]
rune-core = { path = "../rune-core" }
rune-db = { path = "../rune-db" }
rune-tui = { path = "../rune-tui" }
rune-vfs = { path = "../rune-vfs" }

[dev-dependencies]
# Unifies in `test-support` (`open_raw_connection_at_path_for_test`) for
# every test/dev target only — the same double-listing trick `rune-tui`
# uses on its own `rune-db` entry: simulating a genuinely dead prior
# session in `a_dead_sessions_untitled_draft_is_recovered_on_the_next_
# launch` needs to stamp the `sessions` row through a raw connection.
rune-db = { path = "../rune-db", features = ["test-support"] }
rune-vfs = { path = "../rune-vfs", features = ["fault-injection"] }

[lints]
workspace = true
