[package]
name = "rune-db"
version = "0.1.0"
edition.workspace = true

[features]
# Test-only writer-thread hooks (`Store::kill_writer_for_test`/
# `probe_blocking_for_test`, `OpKind::KillWriterForTest`) that must cross
# the crate boundary into `rune-tui`'s own integration tests — a plain
# `#[cfg(test)]` never applies there, since that flag belongs to this
# crate's own test builds only. Never enabled by a production build:
# `rune-tui` pulls this in as a dev-dependency-only feature.
test-support = []
# Opts a non-test build into the same `assert_invariant!` checks test builds
# always run — e.g. a debug binary a developer wants to run with strict
# checking on, or the fuzzer (never enabled by default: an ordinary shipped
# build must degrade gracefully on a producer-bug invariant violation,
# never panic on a user's session).
strict-invariants = []

[dependencies]
rune-vfs = { path = "../rune-vfs" }
rune-core = { path = "../rune-core" }
libc = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zstd = "0.13.3"

[dev-dependencies]
proptest = { workspace = true }
# Self-dependency trick (Cargo permits it for dev-dependencies, same as
# `rune-tui`'s own self-reference): pulls this crate back in with
# `test-support` and `strict-invariants` turned on, so this crate's OWN
# `#[cfg(test)]` unit tests (`probe_blocking_for_test_confirms_writer_gone_via_send_error`
# etc.) see the hooks too, AND every integration test in `tests/` (which
# link the library WITHOUT `cfg(test)`) arms the writer seam's
# `assert_invariant!` guard too — without this, `cfg(test)` alone would only
# arm it for this crate's own unit tests, never for `tests/`. All without
# making `cargo build` (no dev-dependencies) enable either.
rune-db = { path = ".", features = ["test-support", "strict-invariants"] }

[lints]
workspace = true
