[package]
name = "rune-syntax"
version = "0.1.0"
edition.workspace = true

[dependencies]
rune-core = { path = "../rune-core" }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
# Self-dependency trick: `cfg(test)` alone only enables the strict-invariants
# gate for THIS crate's own `#[cfg(test)] mod tests` (compiled with `--cfg
# test`) — an integration test under `tests/` links the library as an
# ORDINARY (non-test) dependency, so `cfg(test)` is false there and the
# strict asserts would never fire for those full-pipeline scenarios.
# Listing the crate as its own dev-dependency with the feature enabled makes
# Cargo's feature unification turn `strict-invariants` on for every use of
# rune-syntax within a `cargo test` build — unit tests AND integration tests
# alike (mirrors `rune-core`'s and `rune-md`'s own Cargo.toml).
rune-syntax = { path = ".", features = ["strict-invariants"] }

[features]
# Opts a non-test build into the same producer-bug invariant checks test
# builds always run (mirrors rune-core's and rune-md's own
# `strict-invariants`). Never enabled by default: an ordinary shipped build
# must degrade gracefully on a producer-bug invariant violation, never
# panic on a user's document.
strict-invariants = []

[lints]
workspace = true
